services:
  web:
    image: ${DOCKER_IMAGE_NAME}
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    env_file:
      - path: .env
        required: false
    ports:
      - "${WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.barometer-web.rule=Host(`${WEB_PUBLIC_HOST:?WEB_PUBLIC_HOST is required}`)"
      - "traefik.http.routers.barometer-web.entrypoints=websecure"
      - "traefik.http.routers.barometer-web.tls.certresolver=barometer"
      - "traefik.http.services.barometer-web.loadbalancer.server.port=80"

networks:
  web_network:
    external: true
    name: web_network
