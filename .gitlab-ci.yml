stages:
  - test
  - build
  - deploy

variables:
  SERVICE_NAME: barometer-web
  WEB_DOCKERFILE_PATH: Dockerfile
  COMPOSE_FILE_PATH: docker-compose.yml
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

test_frontend:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
  script:
    - npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
    - npm run typecheck
    - npm run build

build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      for ENV_FILE in "$PROD_ENV_FILE" "$STAGE_ENV_FILE"; do
        [ -f "${ENV_FILE:-/dev/null}" ] || continue
        VAL=$(grep '^VITE_API_URL=' "$ENV_FILE" | head -1 | cut -d= -f2-)
        [ -n "$VAL" ] && export VITE_API_URL="$VAL" && break
      done
      echo "VITE_API_URL=${VITE_API_URL:-/api}"
  script:
    - docker build --pull
        --build-arg VITE_API_URL="${VITE_API_URL:-/api}"
        -f "$WEB_DOCKERFILE_PATH"
        -t "$DOCKER_IMAGE_NAME" .
    - docker push "$DOCKER_IMAGE_NAME"
  only:
    - main
    - stage

.deploy_template:
  stage: deploy
  image: docker:27.5.0
  before_script:
    - 'apk add --no-cache openssh-client'
    - 'eval "$(ssh-agent -s)"'
    - 'printf ''%s'' "$TARGET_SSH_PRIVATE_KEY" | tr -d ''\r'' | base64 -d > /tmp/deploy_key'
    - 'chmod 600 /tmp/deploy_key'
    - 'ssh-keygen -y -f /tmp/deploy_key >/dev/null'
    - 'ssh-add /tmp/deploy_key'
    - 'mkdir -p ~/.ssh && chmod 700 ~/.ssh'
    - 'printf "Host *\n\tStrictHostKeyChecking no\n\tPort %s\n" "$TARGET_PORT" > ~/.ssh/config'
  script:
    - ssh "$TARGET_USER@$TARGET_HOST" "mkdir -p $INFRA_PATH"
    - scp "$COMPOSE_FILE_PATH" "$TARGET_USER@$TARGET_HOST:$INFRA_PATH/docker-compose.yml"
    - scp "$TARGET_ENV_FILE" "$TARGET_USER@$TARGET_HOST:$INFRA_PATH/.env"
    - ssh "$TARGET_USER@$TARGET_HOST" "
        export DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME &&
        cd $INFRA_PATH &&
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        docker compose pull web &&
        docker compose up -d --remove-orphans web &&
        docker image prune -f
      "

deploy_stage:
  extends: .deploy_template
  variables:
    INFRA_PATH: "$BASE_DEPLOY_PATH/$SERVICE_NAME"
    TARGET_SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY_STAGE
    TARGET_PORT: $SSH_PORT_STAGE
    TARGET_HOST: $SSH_HOST_STAGE
    TARGET_USER: $SSH_USER_STAGE
    TARGET_ENV_FILE: $STAGE_ENV_FILE
  environment:
    name: staging
  only:
    - stage

deploy_prod:
  extends: .deploy_template
  variables:
    INFRA_PATH: "$BASE_DEPLOY_PATH/$SERVICE_NAME"
    TARGET_SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    TARGET_PORT: $SSH_PORT_PROD
    TARGET_HOST: $SSH_HOST_PROD
    TARGET_USER: $SSH_USER_PROD
    TARGET_ENV_FILE: $PROD_ENV_FILE
  environment:
    name: production
  only:
    - main
